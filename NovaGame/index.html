<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaGame - Platformer Retro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #38bdf8;
            border-radius: 4px;
        }

        canvas {
            background: linear-gradient(to bottom, #1e1b4b, #311042);
            display: block;
        }

        /* Interfaz de usuario por encima del Canvas */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
            text-align: center;
        }

        .game-over-screen h1 {
            font-size: 42px;
            color: #ef4444;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }

        .game-over-screen p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .btn-restart {
            padding: 12px 24px;
            background: #38bdf8;
            border: none;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 0 #0284c7;
        }

        .btn-restart:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .controls-hint {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud">SCORE: <span id="score-val">0</span></div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <h1>¡TE CAÍSTE!</h1>
            <p>Puntuación final: <span id="final-score">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Jugar de Nuevo</button>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-hint">
        Controles: <b>Flechas Izquierda / Derecha</b> o <b>A / D</b> para moverte. <b>Espacio / Flecha Arriba</b> para saltar.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('final-score');

        // Configuración del estado del juego
        let gameActive = true;
        let score = 0;

        // Propiedades del Jugador (Un cubo pixelado azul aqua)
        const player = {
            x: 100,
            y: 200,
            width: 24,
            height: 24,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpForce: 12,
            gravity: 0.5,
            isGrounded: false,
            color: '#00f0ff'
        };

        // Teclado
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // Arreglos de objetos
        let platforms = [];
        let gems = [];
        let particles = [];

        // Inicializar/Generar el mapa inicial
        function initMap() {
            platforms = [
                { x: 50, y: 350, width: 150, height: 20, color: '#4ade80' },
                { x: 260, y: 300, width: 120, height: 20, color: '#4ade80' },
                { x: 450, y: 240, width: 100, height: 20, color: '#4ade80' },
                { x: 620, y: 320, width: 130, height: 20, color: '#4ade80' },
                { x: 350, y: 150, width: 110, height: 20, color: '#a855f7' } // Plataforma alta
            ];

            gems = [
                { x: 310, y: 250, size: 8, collected: false, color: '#eab308' },
                { x: 490, y: 190, size: 8, collected: false, color: '#eab308' },
                { x: 400, y: 100, size: 8, collected: false, color: '#ec4899' } // Gema especial rosa
            ];
            
            particles = [];
        }

        // --- SISTEMA DE ENTRADA (TECLADO) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
        });

        // Crear explosión de partículas pixeladas al agarrar gemas
        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    life: 30,
                    color: color
                });
            }
        }

        // --- LÓGICA DE ACTUALIZACIÓN ---
        function update() {
            if (!gameActive) return;

            // Movimiento horizontal
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            // Aplicar gravedad
            player.vy += player.gravity;

            // Guardar posición previa para colisiones perfectas
            let prevY = player.y;

            // Mover ejes
            player.x += player.vx;
            player.y += player.vy;

            // Límites de pantalla laterales
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Verificar si cae al vacío (Game Over)
            if (player.y > canvas.height) {
                gameActive = false;
                finalScore.textContent = score;
                gameOverScreen.style.display = 'flex';
                return;
            }

            // --- FÍSICAS Y COLISIONES DE PLATAFORMAS ---
            player.isGrounded = false;
            
            for (let plat of platforms) {
                // Comprobar intersección de cajas (AABB)
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y) {
                    
                    // Venía cayendo por encima de la plataforma
                    if (prevY + player.height <= plat.y + 8) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    }
                }
            }

            // Salto
            if (keys.up && player.isGrounded) {
                player.vy = -player.jumpForce;
                player.isGrounded = false;
            }

            // --- COLISIÓN CON GEMAS ---
            for (let gem of gems) {
                if (!gem.collected &&
                    player.x < gem.x + gem.size * 2 &&
                    player.x + player.width > gem.x &&
                    player.y < gem.y + gem.size * 2 &&
                    player.y + player.height > gem.y) {
                    
                    gem.collected = true;
                    let points = gem.color === '#ec4899' ? 25 : 10; // Gema rosa vale más
                    score += points;
                    scoreVal.textContent = score;
                    createExplosion(gem.x + gem.size, gem.y + gem.size, gem.color);

                    // Si agarras todas las gemas, reaparecen de forma aleatoria para seguir jugando infinitamente
                    if (gems.every(g => g.collected)) {
                        respawnGems();
                    }
                }
            }

            // Actualizar partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Generar gemas nuevas aleatorias cuando limpias el nivel
        function respawnGems() {
            for (let gem of gems) {
                gem.collected = false;
                // Asignar a una plataforma aleatoria
                let randomPlat = platforms[Math.floor(Math.random() * platforms.length)];
                gem.x = randomPlat.x + Math.random() * (randomPlat.width - 20);
                gem.y = randomPlat.y - 30;
            }
            score += 50; // Bonus por limpiar nivel
            scoreVal.textContent = score;
        }

        // --- RENDERIZADO (DIBUJO) ---
        function draw() {
            // Limpiar pantalla con un tono oscuro
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar fondo de cuadrícula retro sutil
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 32) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Dibujar plataformas
            for (let plat of platforms) {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                
                // Bordes pixelados superiores oscuros para estética
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(plat.x, plat.y + plat.height - 5, plat.width, 5);
            }

            // Dibujar gemas (estilo rombo retro)
            for (let gem of gems) {
                if (!gem.collected) {
                    ctx.fillStyle = gem.color;
                    ctx.beginPath();
                    ctx.moveTo(gem.x + gem.size, gem.y);
                    ctx.lineTo(gem.x + gem.size * 2, gem.y + gem.size);
                    ctx.lineTo(gem.x + gem.size, gem.y + gem.size * 2);
                    ctx.lineTo(gem.x, gem.y + gem.size);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Dibujar Partículas
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0; // Resetear alfa

            // Dibujar Jugador con un pequeño detalle de "ojos" pixelados según su dirección
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Ojos del cubo
            ctx.fillStyle = '#0f172a';
            if (player.vx >= 0) { // Mirando a la derecha
                ctx.fillRect(player.x + 14, player.y + 6, 4, 4);
                ctx.fillRect(player.x + 6, player.y + 6, 4, 4);
            } else { // Mirando a la izquierda
                ctx.fillRect(player.x + 4, player.y + 6, 4, 4);
                ctx.fillRect(player.x + 12, player.y + 6, 4, 4);
            }
        }

        // Bucle principal del juego
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Reiniciar el juego por completo
        function resetGame() {
            player.x = 100;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            scoreVal.textContent = score;
            initMap();
            gameOverScreen.style.display = 'none';
            gameActive = true;
        }

        // Arrancar juego por primera vez
        initMap();
        loop();
    </script>
</body>
</html>
