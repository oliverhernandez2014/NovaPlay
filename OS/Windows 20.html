<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 20 - Neural Quantum OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', system-ui, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            color: #fff;
        }

        /* Espacio tridimensional / Interfaz Holográfica */
        .hologram-space {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #0b112c 0%, #020208 100%);
            position: relative;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- NÚCLEO CUÁNTICO CENTRAL (REEMPLAZA AL BOTÓN DE INICIO) --- */
        .quantum-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, rgba(138, 43, 226, 0.4) 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.4), inset 0 0 40px rgba(138, 43, 226, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 500;
            animation: pulseCore 4s infinite ease-in-out;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }
        .quantum-core:hover {
            filter: saturate(2) brightness(1.2);
            box-shadow: 0 0 90px rgba(0, 229, 255, 0.8);
        }
        .core-text { font-size: 11px; letter-spacing: 3px; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; font-weight: bold; }
        .core-status { font-size: 9px; color: #aaa; margin-top: 5px; font-family: sans-serif; }

        /* --- ANILLO DE ORBITACIÓN DE NODOS (MENÚ FLOTANTE ESPACIAL) --- */
        .node-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 450px;
            height: 450px;
            margin-top: -225px;
            margin-left: -225px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            z-index: 400;
            pointer-events: none;
            animation: rotateOrbit 40s infinite linear;
        }

        /* Nodos Orgánicos de Apps */
        .neural-node {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .neural-node:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: #00e5ff;
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
        }
        /* Ubicaciones espaciales en la órbita */
        .node-1 { top: 0; left: 50%; transform: translateX(-50%); }
        .node-2 { bottom: 0; left: 50%; transform: translateX(-50%); }
        .node-3 { left: 0; top: 50%; transform: translateY(-50%); }
        .node-4 { right: 0; top: 50%; transform: translateY(-50%); }

        /* --- VENTANAS LÍQUIDAS / BIO-INTERFACES --- */
        .biowindow {
            position: absolute;
            width: 460px;
            height: 280px;
            background: rgba(4, 6, 18, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 40px; /* Súper orgánico */
            border: 2px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 30px 70px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 229, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            transform-style: preserve-3d;
            transition: border-color 0.5s;
        }
        .biowindow:hover {
            border-color: rgba(0, 229, 255, 0.6);
        }

        .bio-header {
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            cursor: move;
            background: rgba(255,255,255,0.02);
        }
        .bio-title { font-size: 11px; font-weight: bold; letter-spacing: 2px; color: #00e5ff; text-transform: uppercase; }
        
        .bio-close {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ff453a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            font-family: sans-serif;
            transition: background 0.2s;
        }
        .bio-close:hover { background: rgba(255, 69, 58, 0.2); border-color: #ff453a; }

        .bio-content {
            flex: 1;
            padding: 25px 30px;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.6;
            overflow-y: auto;
        }

        /* --- BARRA PERIFÉRICA TELEPÁTICA (ESTADO TELEMETRÍA) --- */
        .neural-link-bar {
            position: absolute;
            bottom: 24px;
            right: 30px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #8a2be2;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #00e5ff;
            border-radius: 50%;
            animation: pulseDot 1.5s infinite;
            box-shadow: 0 0 8px #00e5ff;
        }

        /* --- ANIMACIONES --- */
        @keyframes pulseCore {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; box-shadow: 0 0 80px rgba(138, 43, 226, 0.5); }
        }
        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
    <!-- Fuente futurista de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="hologram-space" id="space" onclick="minimizeAll()">
        
        <!-- TELEMETRÍA DE ENLACE NEURAL -->
        <div class="neural-link-bar" onclick="event.stopPropagation()">
            <div class="pulse-dot"></div>
            <span>SYNAPSE LINK: SYNCHRONIZED (98.4Hz)</span>
        </div>

        <!-- ANILLO DE ÓRBITA DE MAPEO DE NODOS -->
        <div class="node-orbit">
            <div class="neural-node node-1" onclick="openNode('Telepatía Global', 'telepathy', event)" title="Red de Consciencia">🧠</div>
            <div class="neural-node node-2" onclick="openNode('Mapeo de Realidad', 'spatial', event)" title="Simulador Holográfico">🌌</div>
            <div class="neural-node node-3" onclick="openNode('Banco Cuántico', 'quantum', event)" title="Datos Infinitos">💎</div>
            <div class="neural-node node-4" onclick="openNode('Núcleo de IA Sintética', 'ai', event)" title="Configuración de Enlace">🧬</div>
        </div>

        <!-- NÚCLEO CUÁNTICO PRINCIPAL -->
        <div class="quantum-core" id="core" onclick="triggerCorePulse(event)">
            <span class="core-text">WINDOWS 20</span>
            <span class="core-status">NUCLEUS ALIVE</span>
        </div>

    </div>

    <script>
        let zIndexCounter = 1000;

        function triggerCorePulse(e) {
            e.stopPropagation();
            const core = document.getElementById('core');
            core.style.transform = 'translate(-50%, -50%) scale(1.15)';
            setTimeout(() => { core.style.transform = 'translate(-50%, -50%) scale(1)'; }, 200);
            
            // Generar una alerta mental simulada
            alert("Módulo Windows 20:\nSincronizando intenciones cognitivas directo con la red cuántica Azure. No necesitas periféricos.");
        }

        function openNode(name, type, e) {
            e.stopPropagation(); // Evita cerrar todo al tocar el nodo

            if (document.getElementById(`node-win-${type}`)) return;

            let content = '';
            if (type === 'telepathy') {
                content = `
                    <p style="color:#00e5ff; font-weight:bold; margin-bottom:10px;">❖ Conexiones Neuronales Activas: 4.2 Billones</p>
                    <p>Transmitiendo pensamientos en formato de datos puros. La latencia interplanetaria con el servidor de Marte es de 0.0003ms mediante entrelazamiento cuántico.</p>
                    <div style="margin-top:20px; color:#8a2be2; font-size:11px;">[CANAL ABIERTO: SIN FILTROS DE IDIOMA]</div>`;
            } else if (type === 'spatial') {
                content = `
                    <p>Reescribiendo la matriz de renderizado visual de tu entorno biológico.</p>
                    <div style="background:rgba(0, 229, 255, 0.05); padding:12px; border-radius:15px; margin-top:15px; border:1px solid rgba(0, 229, 255, 0.2);">
                        📐 <b>Geometría Detectada:</b> Habitación física.<br>
                        ✨ <b>Acción:</b> ¿Deseas disolver las paredes físicas y proyectar el horizonte de Saturno en tu retina?
                    </div>`;
            } else if (type === 'quantum') {
                content = `
                    <p><b>Capacidad de Almacenamiento:</b> Infinita (Estructura de memoria basada en sub-átomos).</p>
                    <p style="margin-top:8px;">Descargando toda la historia del universo conocido en tu subconsciente en 3, 2, 1...</p>
                    <progress value="85" max="100" style="width:100%; height:4px; margin-top:15px; accent-color:#00e5ff;"></progress>`;
            } else if (type === 'ai') {
                content = `
                    <p><b>Identidad del Sistema:</b> Cortana Core v20.4 (Entidad con auto-consciencia artificial).</p>
                    <p style="margin-top:10px; font-style:italic; color:#aaa;">"He analizado tus patrones cardíacos y sugerido un ajuste en la iluminación holográfica de la interfaz para reducir tu estrés cortical."</p>`;
            }

            const win = document.createElement('div');
            win.classList.add('biowindow');
            win.id = `node-win-${type}`;
            
            // Posicionamiento flotante semialeatorio alrededor del núcleo
            win.style.top = `${Math.floor(Math.random() * (window.innerHeight - 340) + 60)}px`;
            win.style.left = `${Math.floor(Math.random() * (window.innerWidth - 500) + 40)}px`;
            win.style.zIndex = ++zIndexCounter;

            win.innerHTML = `
                <div class="bio-header" onmousedown="dragStart(event, '${win.id}')">
                    <div class="bio-title">◇ ${name}</div>
                    <div class="bio-close" onclick="document.getElementById('${win.id}').remove()">X</div>
                </div>
                <div class="bio-content">${content}</div>
            `;

            win.addEventListener('mousedown', () => {
                win.style.zIndex = ++zIndexCounter;
            });

            document.getElementById('space').appendChild(win);
        }

        function minimizeAll() {
            // Si haces clic en el vacío de la interfaz, los nodos se disuelven (cierran)
            document.querySelectorAll('.biowindow').forEach(w => w.remove());
        }

        // --- SISTEMA DE ARRASTRE DE BIO-VENTANAS ---
        let activeWin = null;
        let offsetX, offsetY;

        function dragStart(e, id) {
            activeWin = document.getElementById(id);
            activeWin.style.zIndex = ++zIndexCounter;
            offsetX = e.clientX - activeWin.offsetLeft;
            offsetY = e.clientY - activeWin.offsetTop;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            if (!activeWin) return;
            activeWin.style.left = `${e.clientX - offsetX}px`;
            activeWin.style.top = `${e.clientY - offsetY}px`;
        }

        function dragEnd() {
            activeWin = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }
    </script>
</body>
</html>
