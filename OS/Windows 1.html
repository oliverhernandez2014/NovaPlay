<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Windows 1.1 (1985)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Contenedor principal con la mítica paleta de color azul/turquesa de los monitores EGA */
        .desktop {
            width: 100%;
            height: 100vh;
            background-color: #00aaaa;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- MENÚ SUPERIOR DE LA ÉPOCA --- */
        .top-menu {
            background-color: #ffffff;
            color: #000000;
            height: 22px;
            font-size: 14px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 2px solid #000000;
            gap: 20px;
        }
        .menu-btn { cursor: pointer; }
        .menu-btn:hover { background-color: #000000; color: #ffffff; }

        /* --- ÁREA DE TRABAJO EN MOSAICO (TILING INTERFACE) --- */
        .workspace {
            flex: 1;
            display: flex; /* Las ventanas se alinean una al lado de la otra, no encima */
            background-color: #00aaaa;
            padding: 4px;
            gap: 6px;
            overflow: hidden;
        }

        /* --- VENTANA ESTILO WINDOWS 1.x --- */
        .window {
            flex: 1; /* Divide el espacio disponible equitativamente */
            background-color: #ffffff;
            border: 3px solid #000000;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 250px;
        }

        /* Barra de título azul rey clásica */
        .window-header {
            background-color: #0000aa;
            color: #ffffff;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-bottom: 2px solid #000000;
        }
        
        /* El botón de cerrar en Windows 1 era una caja con una línea horizontal */
        .close-box {
            width: 18px;
            height: 14px;
            border: 2px solid #ffffff;
            background-color: #0000aa;
            cursor: pointer;
            position: relative;
        }
        .close-box::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 2px;
            width: 10px;
            height: 2px;
            background-color: #ffffff;
        }

        .window-title {
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Barra de menú interna de la aplicación */
        .app-menu {
            background-color: #ffffff;
            color: #000000;
            border-bottom: 2px solid #000000;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            gap: 15px;
        }
        .app-menu span { cursor: pointer; }

        .window-content {
            flex: 1;
            padding: 10px;
            background-color: #ffffff;
            color: #000000;
            font-size: 13px;
            overflow: auto;
        }

        /* --- SISTEMA DE CORRIDA DE ICONOS INFERIOR (SPOOLER BAR) --- */
        .icon-bar {
            height: 50px;
            background-color: #000000;
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 15px;
        }
        .retro-icon {
            background-color: #0000aa;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .retro-icon:hover {
            background-color: #ffffff;
            color: #0000aa;
        }

        /* --- ESTILOS DE APLICACIONES INTERNAS --- */
        /* MS-DOS Executive (El gestor de archivos original) */
        .file-list { display: flex; flex-direction: column; gap: 4px; }
        .file-item { cursor: pointer; color: #000000; }
        .file-item:hover { background-color: #0000aa; color: #ffffff; }

        /* Notepad */
        .retro-textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- MENÚ SUPERIOR DEL SISTEMA -->
    <div class="top-menu">
        <span class="menu-btn" onclick="alert('Microsoft Windows\nVersión 1.1\nCopyright (C) 1985 Microsoft Corp.')">System</span>
        <span style="margin-left: auto;" id="live-clock">00:00:00</span>
    </div>

    <!-- ÁREA DE TRABAJO (MOSAICO AUTOMÁTICO) -->
    <div class="workspace" id="workspace">
        
        <!-- VENTANA NATIVA: MS-DOS EXECUTIVE -->
        <div class="window" id="win-dos">
            <div class="window-header">
                <div class="close-box" onclick="alert('MS-DOS Executive no se puede cerrar en esta simulación.')"></div>
                <div class="window-title">MS-DOS Executive</div>
                <div></div>
            </div>
            <div class="app-menu">
                <span>File</span> <span>View</span> <span>Special</span>
            </div>
            <div class="window-content">
                <p style="margin-bottom: 8px; color: #0000aa;">Disk Space: 342K Free</p>
                <div class="file-list">
                    <div class="file-item" onclick="openApp('Notepad', 'notepad')">📝 NOTEPAD.EXE</div>
                    <div class="file-item" onclick="openApp('Clock', 'clock')">🕒 CLOCK.EXE</div>
                    <div class="file-item" onclick="openApp('Calculator', 'calc')">🧮 CALC.EXE</div>
                    <div class="file-item">💾 REVERSI.EXE</div>
                    <div class="file-item">⚙️ CONTROL.EXE</div>
                </div>
            </div>
        </div>

    </div>

    <!-- BARRA INFERIOR DE ICONOS (DONDE SE "MINIMIZABAN") -->
    <div class="icon-bar">
        <div class="retro-icon" onclick="openApp('Notepad', 'notepad')">Notepad</div>
        <div class="retro-icon" onclick="openApp('Clock', 'clock')">Clock</div>
        <div class="retro-icon" onclick="openApp('Calculator', 'calc')">Calc</div>
    </div>

    <script>
        // Diccionario para controlar qué apps ya están en mosaico
        let openApps = { 'win-dos': true };

        function openApp(name, type) {
            const id = `win-${type}`;
            
            // Si la aplicación ya está abierta en el mosaico, no hace nada
            if (openApps[id]) return;

            let content = '';
            if (type === 'notepad') {
                content = `<textarea class="retro-textarea" placeholder="Escriba aquí...&#10;Windows 1.1 no sobrepone ventanas, divide la pantalla automáticamente."></textarea>`;
            } else if (type === 'clock') {
                content = `
                    <div style="text-align:center; padding-top:20px;">
                        <p style="font-size:18px; border:2px solid #000; padding:10px; background:#0000aa; color:#fff;">HORA LOCAL</p>
                        <h2 style="font-size:28px; margin-top:20px;" id="retro-time">00:00</h2>
                    </div>`;
            } else if (type === 'calc') {
                content = `
                    <div style="background:#fff; border:2px solid #000; padding:4px;">
                        <div style="border:2px solid #000; padding:4px; text-align:right; font-size:18px; margin-bottom:8px;">0.</div>
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; text-align:center;">
                            <div style="border:1px solid #000; padding:4px; cursor:pointer;">7</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">8</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">9</div><div style="border:1px solid #000; background:#0000aa; color:white; padding:4px;">/</div>
                            <div style="border:1px solid #000; padding:4px; cursor:pointer;">4</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">5</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">6</div><div style="border:1px solid #000; background:#0000aa; color:white; padding:4px;">*</div>
                            <div style="border:1px solid #000; padding:4px; cursor:pointer;">1</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">2</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">3</div><div style="border:1px solid #000; background:#0000aa; color:white; padding:4px;">-</div>
                            <div style="border:1px solid #000; padding:4px; cursor:pointer;">0</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">.</div><div style="border:1px solid #000; padding:4px; cursor:pointer;">=</div><div style="border:1px solid #000; background:#0000aa; color:white; padding:4px;">+</div>
                        </div>
                    </div>`;
            }

            const win = document.createElement('div');
            win.classList.add('window');
            win.id = id;

            win.innerHTML = `
                <div class="window-header">
                    <div class="close-box" onclick="closeApp('${id}')"></div>
                    <div class="window-title">${name}</div>
                    <div></div>
                </div>
                <div class="app-menu">
                    <span>Edit</span> <span>Search</span>
                </div>
                <div class="window-content">${content}</div>
            `;

            document.getElementById('workspace').appendChild(win);
            openApps[id] = true;
        }

        function closeApp(id) {
            document.getElementById(id).remove();
            delete openApps[id];
        }

        // Sistema de hora retro
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            let s = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
            
            const retroTimeDisplay = document.getElementById('retro-time');
            if (retroTimeDisplay) {
                retroTimeDisplay.textContent = `${h}:${m}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
