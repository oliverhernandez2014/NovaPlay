<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12 Concept</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* Fondo de pantalla futurista Fluent/Mica */
        .desktop {
            width: 100%;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        /* --- EFECTO MICA / ACRÍLICO TRANSLÚCIDO (DISEÑO FLUENT) --- */
        .fluent-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        /* --- BARRA DE ESTADO SUPERIOR INDEPENDIENTE --- */
        .top-status-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            height: 40px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 2000;
        }
        .search-pill {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 16px;
            border-radius: 14px;
            color: white;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .top-right-indicators {
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
            font-size: 13px;
            font-weight: 500;
        }

        /* --- FLOATING TASKBAR (CENTRADO Y SUSPENDIDO) --- */
        .taskbar-container {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            height: 60px;
            padding: 0 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
        }
        
        .taskbar-item {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .taskbar-item:hover {
            transform: scale(1.15) translateY(-4px);
            background: rgba(255,255,255,0.1);
        }
        
        /* Botón de Copilot IA Brillante */
        .ai-btn {
            background: linear-gradient(135deg, #2b58f6 0%, #ca3bf5 100%);
            box-shadow: 0 0 15px rgba(111, 60, 245, 0.5);
        }
        .ai-btn:hover {
            box-shadow: 0 0 25px rgba(111, 60, 245, 0.8);
        }

        /* --- MENÚ INICIO SUSPENDIDO (START MENU) --- */
        .start-menu {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            width: 520px;
            height: 400px;
            border-radius: 24px;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s;
            z-index: 1900;
            padding: 24px;
            color: white;
        }
        .start-menu.open {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .start-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .start-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
        }
        .start-app .icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .start-app:hover .icon { background: rgba(255,255,255,0.15); transform: scale(1.05); }

        /* --- VENTANAS MODERNAS CON CANTOS MUY REDONDEADOS --- */
        .window {
            position: absolute;
            width: 600px;
            height: 400px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
        }

        .window-header {
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            cursor: move;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .window-title { font-size: 13px; font-weight: 500; letter-spacing: 0.5px; }
        
        .window-controls { display: flex; gap: 8px; }
        .win-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }
        .win-btn:hover { background: rgba(255,255,255,0.3); }
        .win-btn.close-btn:hover { background: #ff453a; }

        .window-content { flex: 1; padding: 20px; overflow: auto; }

        /* PANEL LATERAL DE COPILOT IA */
        .copilot-panel {
            position: absolute;
            top: 64px;
            right: -350px;
            width: 320px;
            height: calc(100vh - 140px);
            border-radius: 20px;
            z-index: 1800;
            transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .copilot-panel.open { right: 20px; }
        .chat-area { flex: 1; overflow-y: auto; margin-top: 15px; font-size: 13px; color: #ddd; }
        .chat-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 12px;
            color: white;
            outline: none;
            width: 100%;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="desktop" id="desktop" onclick="closeMenus()">
        
        <!-- BARRA DE ESTADO SUPERIOR FLOATING -->
        <div class="top-status-bar fluent-panel" onclick="event.stopPropagation()">
            <div class="search-pill">
                <span>🔍</span> <span>Buscar con Copilot...</span>
            </div>
            <div class="top-right-indicators">
                <span>👁️‍🗨️ AI Activa</span>
                <span>📶 Wi-Fi 7</span>
                <span id="clock">00:00 AM</span>
            </div>
        </div>

        <!-- PANEL DE ASISTENTE IA (COPILOT W12) -->
        <div class="copilot-panel fluent-panel" id="copilotPanel" onclick="event.stopPropagation()">
            <h4>✨ Copilot OS</h4>
            <hr style="border:none; border-top:1px solid rgba(255,255,255,0.1); margin:10px 0;">
            <div class="chat-area" id="chatArea">
                <p style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">Hola. Soy la IA nativa de Windows 12. ¿Qué configuración o automatización deseas aplicar al ecosistema hoy?</p>
            </div>
            <input type="text" class="chat-input" placeholder="Pregúntale a Windows..." onkeydown="if(event.key==='Enter') sendAiMessage(this)">
        </div>

        <!-- MENÚ DE INICIO FLOTANTE -->
        <div class="start-menu fluent-panel" id="startMenu" onclick="event.stopPropagation()">
            <h5 style="color: rgba(255,255,255,0.6); font-size: 12px; text-transform: uppercase;">Aplicaciones Inteligentes</h5>
            <div class="start-grid">
                <div class="start-app" onclick="openApp('Explorador de Archivos', 'files')">
                    <div class="icon">📁</div><span>Archivos</span>
                </div>
                <div class="start-app" onclick="openApp('Copilot Workspace', 'workspace')">
                    <div class="icon" style="background: linear-gradient(135deg, #4158d0, #c850c0);">🧠</div><span>Workspace</span>
                </div>
                <div class="start-app" onclick="openApp('Xbox Cloud Gaming', 'xbox')">
                    <div class="icon">💚</div><span>Xbox Cloud</span>
                </div>
                <div class="start-app" onclick="openApp('Ajustes del Sistema', 'settings')">
                    <div class="icon">⚙️</div><span>Configuración</span>
                </div>
            </div>
        </div>

        <!-- FLOATING TASKBAR (SHELF ESTILO NEXT-GEN) -->
        <div class="taskbar-container fluent-panel" onclick="event.stopPropagation()">
            <div class="taskbar-item" onclick="toggleStartMenu()">🪟</div>
            <div class="taskbar-item" onclick="openApp('Explorador de Archivos', 'files')">📁</div>
            <div class="taskbar-item" onclick="openApp('Xbox Cloud Gaming', 'xbox')">💚</div>
            <div class="taskbar-item taskbar-item ai-btn" onclick="toggleCopilot()">✨</div>
        </div>

    </div>

    <script>
        let zIndexCounter = 100;

        function toggleStartMenu() {
            document.getElementById('startMenu').classList.toggle('open');
        }

        function toggleCopilot() {
            document.getElementById('copilotPanel').classList.toggle('open');
        }

        function closeMenus() {
            document.getElementById('startMenu').classList.remove('open');
            document.getElementById('copilotPanel').classList.remove('open');
        }

        // Simulación de respuesta de IA
        function sendAiMessage(input) {
            if(!input.value.trim()) return;
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML += `<p style="margin-top:10px; text-align:right; color:#ca3bf5;"><b>Tú:</b> ${input.value}</p>`;
            
            let userPrompt = input.value.toLowerCase();
            input.value = '';
            
            setTimeout(() => {
                let reply = "Entendido. Procesando comando de optimización en la nube de Windows 12.";
                if(userPrompt.includes('hola')) reply = "¡Hola! Estoy listo para optimizar tu flujo de trabajo en la PC.";
                if(userPrompt.includes('jugar')) reply = "Iniciando optimización de latencia de red para Xbox Cloud Gaming...";
                
                chatArea.innerHTML += `<p style="margin-top:10px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">✨ ${reply}</p>`;
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 1000);
        }

        // Apertura de Ventanas Modulares
        function openApp(name, type) {
            closeMenus();
            if (document.getElementById(`win-${name}`)) return;

            let content = '';
            if (type === 'workspace') {
                content = `
                    <h3>Espacio Neuronal de Trabajo</h3>
                    <p style="color:#aaa; margin-top:10px; font-size:14px;">Tus proyectos generativos automáticos compartidos en la nube se listarán aquí.</p>
                    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-top:20px; border:1px dashed rgba(255,255,255,0.2);">
                        🤖 <b>Sugerencia de IA:</b> Notamos que usas mucho código HTML, ¿creamos un servidor local optimizado?
                    </div>`;
            } else if (type === 'xbox') {
                content = `
                    <div style="background:#107c10; height:100%; border-radius:12px; padding:20px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                        <h2 style="font-weight:800;">XBOX CLOUD GAMING</h2>
                        <p style="font-size:13px; margin-top:5px; opacity:0.9;">Streaming directo desde servidores Azure</p>
                        <button style="margin-top:20px; background:white; color:black; border:none; padding:10px 24px; border-radius:20px; font-weight:bold; cursor:pointer;" onclick="alert('Conectando al mando...')">Transmitir Juego</button>
                    </div>`;
            } else if (type === 'settings') {
                content = `
                    <h4>Configuración del Ecosistema Modular</h4>
                    <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Ajustes basados en telemetría fluida</p>
                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:10px; display:flex; justify-content:between;"><span>🧠 Co-Procesamiento por IA</span> <span style="color:#4af626; margin-left:auto;">Activo (NPU)</span></div>
                        <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:10px; display:flex; justify-content:between;"><span>🌌 Interfaz Líquida / Mica Efecto</span> <span style="color:#ca3bf5; margin-left:auto;">Ultra</span></div>
                    </div>`;
            } else {
                content = `<h3>${name}</h3><p style="color:#aaa; margin-top:10px;">Acceso local unificado a archivos híbridos (SSD + OneDrive).</p>`;
            }

            const win = document.createElement('div');
            win.classList.add('window');
            win.id = `win-${name}`;
            win.style.top = '140px';
            win.style.left = '160px';
            win.style.zIndex = ++zIndexCounter;

            win.innerHTML = `
                <div class="window-header" onmousedown="dragStart(event, '${win.id}')">
                    <div class="window-title">❖ ${name}</div>
                    <div class="window-controls">
                        <div class="win-btn">─</div>
                        <div class="win-btn close-btn" onclick="document.getElementById('${win.id}').remove()">✕</div>
                    </div>
                </div>
                <div class="window-content">${content}</div>
            `;

            win.addEventListener('mousedown', () => { win.style.zIndex = ++zIndexCounter; });
            document.getElementById('desktop').appendChild(win);
        }

        // --- SISTEMA DE ARRASTRE DE VENTANAS ---
        let activeWin = null;
        let offsetX, offsetY;

        function dragStart(e, id) {
            activeWin = document.getElementById(id);
            activeWin.style.zIndex = ++zIndexCounter;
            offsetX = e.clientX - activeWin.offsetLeft;
            offsetY = e.clientY - activeWin.offsetTop;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            if (!activeWin) return;
            activeWin.style.left = `${e.clientX - offsetX}px`;
            activeWin.style.top = `${e.clientY - offsetY}px`;
        }

        function dragEnd() {
            activeWin = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }

        // Reloj de la barra de estado superior
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
