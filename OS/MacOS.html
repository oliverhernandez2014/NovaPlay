<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Fondo de pantalla oficial estilo abstracto/fluido de macOS */
        .desktop {
            width: 100%;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?q=80&w=1920') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        /* --- BARRA DE MENÚS SUPERIOR (TOP BAR) --- */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 24px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            color: #121212;
            font-weight: 500;
            z-index: 2000;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .top-bar-left, .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .apple-logo {
            font-size: 15px;
            cursor: pointer;
        }

        .menu-item { cursor: pointer; }
        .menu-item.bold { font-weight: 700; }

        /* --- EL RECONOCIDO DOCK DE MAC --- */
        .dock-container {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            padding: 8px;
            border-radius: 22px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            z-index: 1500;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .dock-icon {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), margin 0.2s;
            position: relative;
        }

        /* Efecto de aumento al pasar el ratón por el Dock */
        .dock-icon:hover {
            transform: scale(1.3) translateY(-10px);
            margin: 0 8px;
        }

        /* Punto indicador de app abierta abajo del icono */
        .dock-icon.active::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
        }

        /* --- VENTANAS MACOS (CON ESQUINAS REDONDEADAS) --- */
        .window {
            position: absolute;
            width: 550px;
            height: 380px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Barra superior limpia de Mac */
        .window-header {
            background: #f6f6f6;
            height: 42px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
            cursor: move;
            border-bottom: 1px solid #e5e5e5;
        }

        /* Los tres botones de semáforo */
        .traffic-lights {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 16px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: rgba(0,0,0,0.5);
        }
        .light.close { background: #ff5f56; border: 0.5px solid #e0443e; }
        .light.minimize { background: #ffbd2e; border: 0.5px solid #dea123; }
        .light.maximize { background: #27c93f; border: 0.5px solid #1aab29; }
        
        /* Aparece la simbología interna al pasar el mouse por el semáforo */
        .traffic-lights:hover .light::before {
            font-weight: bold;
        }
        .traffic-lights:hover .light.close::before { content: "×"; }
        .traffic-lights:hover .light.minimize::before { content: "−"; }
        .traffic-lights:hover .light.maximize::before { content: "+"; }

        .window-title {
            width: 100%;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a4a;
        }

        .window-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            background: #ffffff;
            color: #333;
        }

        /* --- INTERIOR DE LAS APPS --- */
        /* Finder */
        .finder-layout { display: flex; height: 100%; margin: -20px; }
        .finder-sidebar { width: 30%; background: #f0f0f0; padding: 20px 12px; font-size: 13px; border-right: 1px solid #e5e5e5; }
        .sidebar-item { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; color: #444; }
        .sidebar-item:hover, .sidebar-item.active { background: rgba(0,0,0,0.05); color: #000; font-weight: 500;}
        .finder-main { width: 70%; padding: 20px; background: white; }

        /* Safari */
        .safari-bar { background: #f0f0f0; padding: 6px; margin: -20px -20px 15px -20px; display: flex; justify-content: center; border-bottom: 1px solid #e5e5e5; }
        .safari-input { width: 60%; background: #e3e3e3; border: none; padding: 4px 12px; border-radius: 6px; text-align: center; font-size: 12px; outline: none; }
    </style>
</head>
<body>

    <div class="desktop" id="desktop">
        
        <!-- BARRA SUPERIOR DE MACOS -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span class="apple-logo" onclick="alert(' Mac de simulación\nmacOS Sequoia Edition')"></span>
                <span class="menu-item bold">Finder</span>
                <span class="menu-item">Archivo</span>
                <span class="menu-item">Edición</span>
                <span class="menu-item">Ir</span>
                <span class="menu-item">Ventana</span>
            </div>
            <div class="top-bar-right">
                <span>📶</span>
                <span>🔋 100%</span>
                <span id="clock">00:00 AM</span>
            </div>
        </div>

        <!-- EL DOCK DE APLICACIONES FLOTANTE -->
        <div class="dock-container">
            <div class="dock-icon" id="dock-Finder" onclick="openApp('Finder', 'finder')">💻</div>
            <div class="dock-icon" id="dock-Safari" onclick="openApp('Safari', 'safari')">🧭</div>
            <div class="dock-icon" id="dock-Notas" onclick="openApp('Notas', 'notes')">📝</div>
            <div class="dock-icon" id="dock-Mapas" onclick="openApp('Mapas', 'maps')">🗺️</div>
        </div>

    </div>

    <script>
        let zIndexCounter = 100;

        // Abrir Aplicaciones estilo Mac
        function openApp(name, type) {
            const dockIcon = document.getElementById(`dock-${name}`);
            if (dockIcon) dockIcon.classList.add('active'); // Prende el puntito indicador en el Dock

            if (document.getElementById(`win-${name}`)) return;

            let content = '';

            if (type === 'finder') {
                content = `
                    <div class="finder-layout">
                        <div class="finder-sidebar">
                            <div class="sidebar-item active">🏠 Recientes</div>
                            <div class="sidebar-item">📂 Aplicaciones</div>
                            <div class="sidebar-item">📄 Documentos</div>
                            <div class="sidebar-item">⬇️ Descargas</div>
                        </div>
                        <div class="finder-main">
                            <h4 style="margin-bottom: 10px;">Archivos en iCloud</h4>
                            <p style="color: #666; font-size: 13px;">No hay archivos recientes en esta Mac simulada.</p>
                        </div>
                    </div>`;
            } else if (type === 'safari') {
                content = `
                    <div class="safari-bar"><input type="text" class="safari-input" value="https://www.apple.com"></div>
                    <iframe src="https://bing.com" style="width:100%; height:calc(100% - 40px); border:none; background:white;"></iframe>`;
            } else if (type === 'notes') {
                content = `
                    <h3 style="margin-bottom:10px; color:#b9935a;">Anotaciones rápidas</h3>
                    <textarea style="width:100%; height:85%; border:none; resize:none; outline:none; font-size:14px; line-height:1.5;" placeholder="Escribe tu nota aquí..."></textarea>`;
            } else {
                content = `<div style="padding:10px;"><h3>${name}</h3><p style="margin-top:10px; color:#666;">Contenedor cargado correctamente.</p></div>`;
            }

            const win = document.createElement('div');
            win.classList.add('window');
            win.id = `win-${name}`;
            win.style.top = '100px';
            win.style.left = '140px';
            win.style.zIndex = ++zIndexCounter;

            win.innerHTML = `
                <div class="window-header" onmousedown="dragStart(event, '${win.id}')">
                    <div class="traffic-lights">
                        <div class="light close" onclick="closeWin('${win.id}', '${name}')"></div>
                        <div class="light minimize" onclick="alert('Minimizar de Mac aplicado')"></div>
                        <div class="light maximize" onclick="toggleMaximize('${win.id}')"></div>
                    </div>
                    <div class="window-title">${name}</div>
                </div>
                <div class="window-content">${content}</div>
            `;

            win.addEventListener('mousedown', () => {
                win.style.zIndex = ++zIndexCounter;
            });

            document.getElementById('desktop').appendChild(win);
        }

        function closeWin(id, name) {
            document.getElementById(id).remove();
            const dockIcon = document.getElementById(`dock-${name}`);
            if (dockIcon) dockIcon.classList.remove('active'); // Apaga el puntito indicador del Dock
        }

        function toggleMaximize(id) {
            const win = document.getElementById(id);
            if (win.style.width === '100%') {
                win.style.width = '550px';
                win.style.height = '380px';
                win.style.top = '100px';
                win.style.left = '140px';
                win.style.borderRadius = '12px';
            } else {
                win.style.width = '100%';
                win.style.height = 'calc(100vh - 24px)';
                win.style.top = '24px';
                win.style.left = '0';
                win.style.borderRadius = '0';
            }
        }

        // --- MANEJO DE ARRASTRE ---
        let activeWin = null;
        let offsetX, offsetY;

        function dragStart(e, id) {
            const win = document.getElementById(id);
            if(win.style.width === '100%') return; // Bloquear arrastre si está maximizado
            
            activeWin = win;
            activeWin.style.zIndex = ++zIndexCounter;
            offsetX = e.clientX - activeWin.offsetLeft;
            offsetY = e.clientY - activeWin.offsetTop;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            if (!activeWin) return;
            activeWin.style.left = `${e.clientX - offsetX}px`;
            activeWin.style.top = `${e.clientY - offsetY}px`;
        }

        function dragEnd() {
            activeWin = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
        }

        // Reloj de la barra de menú superior
        function updateClock() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
